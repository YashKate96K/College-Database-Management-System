{% extends 'base.html' %}
{% block content %}

<div class="container mt-5">
  <div class="card shadow-lg border-0 mx-auto" style="max-width: 700px;">
    <div class="card-header bg-primary text-white text-center">
      <h3 class="mb-0"><i class="bi bi-person-plus"></i> Add New Student</h3>
    </div>

    <div class="card-body p-4">
      <form method="POST">
        <!-- First Row -->
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
            <input name="name" class="form-control" placeholder="Enter full name" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
            <input name="email" class="form-control" placeholder="Enter email" type="email" required>
          </div>
        </div>

        <!-- Second Row -->
        <div class="row">
          <div class="col-md-4 mb-3">
            <label class="form-label fw-semibold">Date of Birth</label>
            <input name="dob" class="form-control" type="date">
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label fw-semibold">Department</label>
            <input name="dept" class="form-control" placeholder="Enter department">
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label fw-semibold">Year</label>
            <input name="year" class="form-control" placeholder="Enter year" type="number" min="1" max="10">
          </div>
        </div>

        <!-- Contact and Password -->
        <div class="mb-3">
          <label class="form-label fw-semibold">Phone</label>
          <input name="phone" class="form-control" placeholder="Enter phone number" type="tel">
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Password</label>
          <input name="password" class="form-control" placeholder="Enter password" type="password">
        </div>

        <!-- Submit -->
        <div class="d-grid">
          <button class="btn btn-primary btn-lg">
            <i class="bi bi-check-circle"></i> Add Student
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
