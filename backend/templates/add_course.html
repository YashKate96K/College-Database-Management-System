{% extends 'base.html' %}
{% block content %}

<div class="container mt-5">
  <div class="card shadow-lg border-0 mx-auto" style="max-width: 600px;">
    <div class="card-header bg-primary text-white text-center">
      <h3 class="mb-0"><i class="bi bi-journal-plus"></i> Add New Course</h3>
    </div>
    <div class="card-body p-4">
      <form method="POST">
        <div class="mb-3">
          <label class="form-label fw-semibold">Course Name <span class="text-danger">*</span></label>
          <input name="course_name" class="form-control" placeholder="Enter course name" required>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Department</label>
          <input name="dept" class="form-control" placeholder="Enter department">
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Credits</label>
          <input name="credits" class="form-control" placeholder="Enter number of credits" type="number" min="0">
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Assign Faculty (optional)</label>
          <select name="faculty_id" class="form-select">
            <option value="">-- Select Faculty --</option>
            {% for f in faculties %}
            <option value="{{ f.faculty_id }}">{{ f.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="d-grid">
          <button class="btn btn-primary btn-lg">
            <i class="bi bi-check-circle"></i> Add Course
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
