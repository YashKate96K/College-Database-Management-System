{% extends 'base.html' %}
{% block content %}

<div class="container mt-5">
  <div class="card shadow-lg border-0">
    <div class="card-header bg-primary text-white text-center py-3">
      <h3 class="mb-0"><i class="bi bi-speedometer2"></i> Admin Dashboard</h3>
    </div>

    <div class="card-body p-4">
      <div class="row g-4">

        <!-- Students Card -->
        <div class="col-md-6 col-lg-6">
          <div class="card border-0 shadow-sm h-100 text-center p-3 hover-shadow">
            <div class="card-body">
              <div class="text-primary mb-2">
                <i class="bi bi-people-fill" style="font-size: 2.5rem;"></i>
              </div>
              <h5 class="fw-bold mb-1">Students</h5>
              <p class="display-6 fw-bold text-dark">{{ students_count }}</p>
              <a href="{{ url_for('students_list') }}" class="btn btn-outline-primary btn-sm mt-2">
                <i class="bi bi-gear"></i> Manage Students
              </a>
            </div>
          </div>
        </div>

        <!-- Courses Card -->
        <div class="col-md-6 col-lg-6">
          <div class="card border-0 shadow-sm h-100 text-center p-3 hover-shadow">
            <div class="card-body">
              <div class="text-warning mb-2">
                <i class="bi bi-journal-bookmark-fill" style="font-size: 2.5rem;"></i>
              </div>
              <h5 class="fw-bold mb-1">Courses</h5>
              <p class="display-6 fw-bold text-dark">{{ courses_count or 0 }}</p>
              <a href="{{ url_for('courses_list') }}" class="btn btn-outline-warning btn-sm mt-2">
                <i class="bi bi-book"></i> View Courses
              </a>
            </div>
          </div>
        </div>

      </div>
    </div>

    <div class="card-footer text-muted text-center py-2">
      <small>© 2025 College Management System | Admin Panel</small>
    </div>
  </div>
</div>

<!-- Optional hover shadow effect -->
<style>
.hover-shadow:hover {
  transform: translateY(-5px);
  transition: 0.3s ease;
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}
</style>

{% endblock %}
